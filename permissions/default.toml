"$schema" = "schemas/schema.json"

[default]
description = "Allows the app to register this device for APNs/FCM push notifications and bridge native call ring events (CallKit on iOS, Telecom/ConnectionService on Android) to the webview."
permissions = [
  "allow-register-for-push",
  "allow-register-listener",
  "allow-remove-listener",
  "allow-drain-pending-call-actions",
  "allow-end-call",
]

# For apps that load remote or otherwise less-trusted content: token
# registration and rotation events only, without the call-action bridge
# (drained actions carry signed call-join tokens, and end_call can kill
# live calls).
[[set]]
identifier = "minimal"
description = "Push-token registration and rotation events only — no access to queued call actions (which carry call-join tokens) or to ending calls."
permissions = [
  "allow-register-for-push",
  "allow-register-listener",
  "allow-remove-listener",
]
